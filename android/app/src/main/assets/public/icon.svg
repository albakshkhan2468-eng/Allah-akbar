<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a252a" />
      <stop offset="100%" stop-color="#030c0e" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#10f0b4" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Outer glowing rounded display card -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="#06181d" stroke="#10f0b4" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Digital Clock Display -->
  <rect x="96" y="110" width="320" height="130" rx="28" fill="#040e11" stroke="#10f0b4" stroke-width="4"/>
  <text x="256" y="200" fill="#10f0b4" font-family="monospace, sans-serif" font-size="80" font-weight="900" text-anchor="middle" filter="url(#glow)">22:15</text>
  
  <!-- Calendar Display -->
  <rect x="96" y="270" width="320" height="90" rx="20" fill="#071318" stroke="#f59e0b" stroke-width="4"/>
  <text x="256" y="328" fill="#f59e0b" font-family="monospace, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" filter="url(#glow)">21 . 10 . 2026</text>
  
  <!-- Task indicator dots -->
  <circle cx="150" cy="400" r="10" fill="#10f0b4"/>
  <circle cx="200" cy="400" r="10" fill="#10f0b4"/>
  <circle cx="250" cy="400" r="10" fill="#10f0b4"/>
  <circle cx="300" cy="400" r="10" fill="#f59e0b"/>
  <circle cx="350" cy="400" r="10" fill="#475569"/>
</svg>
